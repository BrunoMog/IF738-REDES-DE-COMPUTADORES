# /etc/ipsec.conf - Site-A (192.168.56.10)

config setup
        charondebug="ike 2, knl 2, cfg 2"

conn %default
        keyexchange=ikev2
        ike=aes256-sha256-modp2048!
        esp=aes256-sha256!
        dpdaction=clear
        dpddelay=300s

conn site-to-site
        authby=secret
        left=192.168.56.10
        leftid=192.168.56.10
        leftsubnet=192.168.56.10/32
        right=192.168.56.20
        rightid=192.168.56.20
        rightsubnet=192.168.56.20/32
        type=tunnel
        auto=add
